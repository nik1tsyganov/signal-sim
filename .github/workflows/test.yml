name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest
        run: python -m unittest discover -s tests -v
      - name: Rank fixture events
        run: python -m signal_sim rank --fixtures
      - name: Hawkes intensity at latest fixture observed_at
        run: python -m signal_sim intensity --fixtures
      - name: Run fixture paper replay
        run: python -m signal_sim replay --fixtures
      - name: Run fixture two-step mark path
        run: python -m signal_sim replay --fixtures --path
